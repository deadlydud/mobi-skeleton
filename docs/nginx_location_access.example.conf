# Example Nginx location rules for a project based on mobi-skeleton.
# Put these inside the relevant server { ... } block, then run:
# nginx -t
# systemctl reload nginx

location ~ /\.git {
    deny all;
    return 404;
}

location ~* \.(env|ini|conf|config|cfg|cnf|key|pem|log|sql|sql\.gz|bak|dump|backup|db|sqlite|swp|swo|tmp|temp|old)$ {
    deny all;
    return 404;
}

location ~* ^/(logs|data|cfg|cache|sql|play|tmp|private|conf|uploads|backup|secret|system|bin|lib|vendor)/ {
    deny all;
    return 404;
}
